spring:
  application:
    name: 03-ali-oss-x-file-storage
dromara:
  x-file-storage: #文件存储配置
    default-platform: aliyun-oss-1 #默认使用的存储平台
    thumbnail-suffix: ".min.jpg" #缩略图后缀，例如【.min.jpg】【.png】
    #对应平台的配置写在这里，注意缩进要对齐
    aliyun-oss:
      - platform: aliyun-oss-1 # 存储平台标识
        enable-storage: true  # 启用存储
        access-key: --
        secret-key: --
        end-point: oss-cn-guangzhou.aliyuncs.com
        bucket-name: kwin-java-learn
        domain: https://kwin-java-learn.oss-cn-guangzhou.aliyuncs.com/ # 访问域名，注意“/”结尾，例如：https://abc.oss-cn-shanghai.aliyuncs.com/
        base-path: ali-oss-x-file-storage/ # 基础路径